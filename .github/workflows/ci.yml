name: Chess Arena CI
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check public/app.js
      - run: node --check src/bots.mjs
      - run: node --check src/game.mjs
      - run: npm test
      - run: npm run e2e
