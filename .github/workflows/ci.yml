name: Chess Arena CI
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y stockfish
      - run: test -x /usr/games/stockfish
      - run: node --check public/app.js
      - run: node --check cloudflare/worker.mjs
      - run: npm run test:cloudflare
      - run: node --check src/bots.mjs
      - run: node --check src/game.mjs
      - run: node --check src/stockfish.mjs
      - run: npm test
      - run: npm run e2e
      - run: docker build -t llm-chess-arena:test .
